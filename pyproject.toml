[project]
name = "pitwall"
version = "0.1.0"
description = "Unofficial Formula 1 rules and race-data agent (Stewards' Room + Ask the Pit Wall)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "google-genai>=0.40",
    "groq>=0.11",
    "openai>=1.50",
    "pymupdf>=2.1",
    "beautifulsoup4>=4.15.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitwall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
