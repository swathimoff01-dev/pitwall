services:
  postgres:
    image: postgres:16
    container_name: pitwall-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pitwall_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_admin}
      POSTGRES_DB: ${POSTGRES_DB:-pitwall}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
